[project]
name = "storm-vx"
version = "3.0.0"
description = "Storm-Vx — Adaptive Reconnaissance and Load Testing Engine"
requires-python = ">=3.10"
dependencies = [
    "aiohttp>=3.9.0",
    "httpx[http2]>=0.25.0",
    "beautifulsoup4>=4.12.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dns = ["dnspython>=2.4.0"]
evasion = ["tls-client>=0.2.1"]
observability = ["prometheus_client>=0.20.0", "opentelemetry-api>=1.20.0", "opentelemetry-sdk>=1.20.0", "opentelemetry-exporter-otlp-proto-grpc>=1.20.0"]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "pytest-cov>=5.0",
    "mypy>=1.0",
    "ruff>=0.4.0",
    "bandit>=1.7.0",
]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

# ─── Package discovery ───
# An editable install (`pip install -e .`) adds the project root to sys.path,
# making all top-level modules (vf_common, plugin_system, etc.) importable.
# Sub-packages (finder, evasion, tester, infra, ui, config, observability)
# are discovered automatically because each contains an __init__.py.
[tool.setuptools.packages.find]
include = ["finder*", "evasion*", "tester*", "infra*", "ui*", "config*", "observability*", "security*", "utils*", "engine*"]

# Root-level .py files that should be installed as importable modules.
[tool.setuptools]
py-modules = [
    "vf_common",
    "vf_network",
    "vf_validator",
    "plugin_system",
    "exceptions",
    "logging_config",
    "VF_FINDER",
    "run",
]

[project.scripts]
storm-vx-finder = "VF_FINDER:main"
storm-vx-tester = "tester.VF_TESTER:main"

# ═══════════════════════════════════════════════════════════════════════════════
# W5.5: Ruff — Fast Python linter (replaces flake8, isort, pyupgrade)
# ═══════════════════════════════════════════════════════════════════════════════

[tool.ruff]
target-version = "py310"
line-length = 120

# Exclude patterns
exclude = [
    ".git",
    "__pycache__",
    "build",
    "dist",
    ".eggs",
    "*.egg-info",
    "VF_CACHE.json",
]

[tool.ruff.lint]
# Enable rule categories
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "TCH",  # flake8-type-checking
    "RUF",  # ruff-specific rules
]

# Ignore specific rules that are too noisy for this codebase
ignore = [
    "E501",    # Line too long (handled by formatter)
    "B905",    # zip without strict= (not always needed)
    "SIM108",  # Use ternary operator (readability preference)
    "RUF012",  # Mutable class attributes (used extensively)
]

# Per-file ignores
[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F841", "B018"]  # Unused variables, useless expressions in tests
"__init__.py" = ["F401"]       # Unused imports in __init__.py (re-exports)

[tool.ruff.lint.isort]
known-first-party = ["finder", "tester", "evasion", "infra", "ui", "config", "utils", "observability", "security"]

# ═══════════════════════════════════════════════════════════════════════════════
# W5.5: mypy — Static type checking
# ═══════════════════════════════════════════════════════════════════════════════

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false  # Too strict for existing codebase
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = false  # Too noisy with noqa comments
strict_optional = true

# Per-module overrides for gradual typing
[[tool.mypy.overrides]]
module = [
    "aiohttp.*",
    "httpx.*",
    "bs4.*",
    "tls_client.*",
    "dns.*",
    "prometheus_client.*",
    "opentelemetry.*",
]
ignore_missing_imports = true

# ═══════════════════════════════════════════════════════════════════════════════
# W5.5: Bandit — Security linting
# ═══════════════════════════════════════════════════════════════════════════════

[tool.bandit]
exclude_dirs = ["tests", ".git", "build", "dist"]
skips = [
    "B101",  # assert_used — we use assert in tests
    "B311",  # random — we intentionally use random for evasion
    "B404",  # import subprocess — legitimate usage in updater
]

# ═══════════════════════════════════════════════════════════════════════════════
# W5.5: pytest — Test configuration (supplements pytest.ini)
# ═══════════════════════════════════════════════════════════════════════════════

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
# Coverage configuration
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks integration tests",
]
